# Copy this file to secrets.yaml (gitignored, never committed) and fill in real values.
#
# Reference a secret by its name in a task, e.g.:
#   "Log into YouTube using the YOUTUBE_PASSWORD credential"
#
# The agent's type_secret action resolves the value server-side and types it
# directly — the LLM only ever sees the secret_id name below, never the value.

secrets:
  YOUTUBE_PASSWORD:
    value: "your-password-here"
    enabled: true
